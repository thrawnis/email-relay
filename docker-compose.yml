# Image is built by ./rebuild.sh (docker buildx build --load), not by `docker compose build`.
#
# Nginx Proxy Manager runs on another server, so the relay publishes its own ports on this
# host's LAN interface. Everything is TLS:
#   RELAY_HTTPS_PORT (8443) -> 8000  HTTPS: admin UI + API. NPM proxies to https://<this-host>:8443
#   587 / 465                        SMTP submission (STARTTLS / implicit TLS), AUTH required
# Firewall these so only NPM (and cloudflared) reach 8443, and only the LAN reaches 587/465.
services:
  email-relay:
    image: email-relay:latest
    container_name: email-relay
    env_file: .env
    ports:
      - "${RELAY_HOST_BIND:-0.0.0.0}:${RELAY_HTTPS_PORT:-8443}:8000"
      - "${RELAY_HOST_BIND:-0.0.0.0}:${SUBMISSION_STARTTLS_PORT:-587}:${SUBMISSION_STARTTLS_PORT:-587}"
      - "${RELAY_HOST_BIND:-0.0.0.0}:${SUBMISSION_TLS_PORT:-465}:${SUBMISSION_TLS_PORT:-465}"
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
